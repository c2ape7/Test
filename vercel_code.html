<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steppe Coffee — Чек-лист</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #1a0a00, #2d1500); min-height: 100vh; font-family: sans-serif; padding: 14px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { color: #f5c842; font-size: 22px; text-align: center; margin-bottom: 4px; }
    .sub { color: #d4a054; font-size: 12px; text-align: center; margin-bottom: 16px; }
    .progress-box { background: rgba(255,255,255,0.07); border: 1px solid rgba(245,200,66,0.2); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .progress-top { display: flex; justify-content: space-between; color: #f5c842; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .progress-top span:last-child { color: #fff; }
    .bar-bg { background: rgba(255,255,255,0.1); border-radius: 99px; height: 8px; }
    .bar-fill { height: 100%; border-radius: 99px; background: #f5c842; transition: width 0.3s; }
    .bar-fill.full { background: #4caf50; }
    .pct { color: #d4a054; font-size: 12px; text-align: right; margin-top: 4px; }
    .pct.full { color: #4caf50; }
    .task { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .task.done { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.5); }
    .check { width: 22px; min-width: 22px; height: 22px; border-radius: 6px; border: 2px solid #f5c842; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.2s; }
    .check.done { background: #4caf50; border-color: #4caf50; }
    .check.done::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 900; }
    .num { color: #d4a054; font-size: 10px; margin-bottom: 2px; }
    .txt { color: #fff; font-size: 13px; line-height: 1.5; }
    .txt.done { color: rgba(255,255,255,0.3); text-decoration: line-through; }
    .btns { display: flex; gap: 8px; margin-top: 4px; }
    .btn { flex: 1; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; font-size: 12px; border: none; }
    .btn-admin { background: rgba(245,200,66,0.15); color: #f5c842; border: 1px solid rgba(245,200,66,0.3) !important; }
    .btn-admin.active { background: rgba(76,175,80,0.2); color: #4caf50; border-color: rgba(76,175,80,0.4) !important; }
    .btn-reset { background: rgba(255,80,80,0.12); color: #ff6b6b; border: 1px solid rgba(255,80,80,0.25) !important; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99; }
    .modal-box { background: #1e0e02; border-radius: 16px; padding: 24px; width: 100%; max-width: 280px; text-align: center; }
    .modal-title { font-weight: 800; font-size: 16px; margin-bottom: 10px; }
    .modal-sub { color: rgba(255,255,255,0.4); font-size: 12px; margin-bottom: 14px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button { flex: 1; border: none; border-radius: 8px; padding: 10px; font-weight: 700; cursor: pointer; }
    input[type=password] { width: 100%; background: #000; color: #fff; border: 1px solid #f5c842; border-radius: 8px; padding: 10px; font-size: 20px; text-align: center; letter-spacing: 6px; outline: none; margin-bottom: 6px; }
    .err { color: #f44; font-size: 12px; margin-bottom: 8px; }
    .save-status { text-align: center; color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>☕ STEPPE COFFEE</h1>
  <div class="sub">Чек-лист шеф-баристы</div>

  <div class="progress-box">
    <div class="progress-top"><span>Прогресс</span><span id="counter">0/0</span></div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>

  <div id="tasklist"></div>

  <div class="btns">
    <button class="btn btn-admin" id="adminBtn" onclick="toggleAdmin()">🔐 Администратор</button>
    <button class="btn btn-reset" onclick="showReset()">🔄 Сбросить смену</button>
  </div>

  <div class="save-status" id="saveStatus"></div>
</div>

<!-- PIN modal -->
<div class="modal hidden" id="pinModal">
  <div class="modal-box" style="border:1px solid #f5c842">
    <div class="modal-title" style="color:#f5c842">🔐 Пин-код</div>
    <input type="password" id="pinInput" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()" />
    <div class="err hidden" id="pinErr">Неверный пин-код</div>
    <div class="modal-btns">
      <button style="background:rgba(255,255,255,0.08);color:#fff" onclick="closePin()">Отмена</button>
      <button style="background:#f5c842;color:#000" onclick="checkPin()">Войти</button>
    </div>
  </div>
</div>

<!-- Reset modal -->
<div class="modal hidden" id="resetModal">
  <div class="modal-box" style="border:1px solid #f44">
    <div class="modal-title" style="color:#ff6b6b">🔄 Сбросить смену?</div>
    <div class="modal-sub">Все отметки будут удалены</div>
    <div class="modal-btns">
      <button style="background:rgba(255,255,255,0.08);color:#fff" onclick="document.getElementById('resetModal').classList.add('hidden')">Отмена</button>
      <button style="background:#f44;color:#fff" onclick="resetShift()">Сбросить</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgxzwbVtxvzmAsHrwOF5TVFeZxz-tCH-lBnYglZ5GYWykZpWeQl7X3lms5o1hD3njh1Q/exec";
const PIN = "1234";

const DEFAULT_TASKS = [
  "Проверить что Яндекс.Алиса на месте, осмотреть книжную зону и все картины на дефекты",
  "Все нужные приборы поставить на зарядку",
  "Занести летку и подмести. Помыть полы в 1 и во 2 зале. Помыть полы в Уборных, протереть раковины, туалеты при необходимости убрать, мусор",
  "Написать в чате «Steppe Coffee», что смена закрыта. Выложить фото отчетов 41, 48 и чеки. Сделать фото Чек листа. Выключить Моно Блок Айко",
  "Пополнить все расходники",
  "Раковина должна быть чистая, посуда убрана, приборы помыты",
  "Протереть бутылки сиропов от капель сиропа",
  "Протереть холодильник изнутри и снаружи",
  "Протереть витрину не оставляя разводов"
];

let tasks = DEFAULT_TASKS.map((t, i) => ({ id: i, text: t, done: false, doneAt: "" }));
let adminMode = false;

function render() {
  const list = document.getElementById("tasklist");
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("counter").textContent = done + "/" + total;
  const bar = document.getElementById("bar");
  bar.style.width = pct + "%";
  bar.className = "bar-fill" + (pct === 100 ? " full" : "");
  const pctEl = document.getElementById("pct");
  pctEl.textContent = pct === 100 ? "✅ Смена завершена!" : pct + "%";
  pctEl.className = "pct" + (pct === 100 ? " full" : "");

  list.innerHTML = "";
  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task" + (t.done ? " done" : "");
    if (!adminMode) div.onclick = () => toggle(t.id);
    div.innerHTML = `
      <div class="check ${t.done ? "done" : ""}"></div>
      <div style="flex:1">
        <div class="num">#${i + 1}</div>
        <div class="txt ${t.done ? "done" : ""}">${t.text}</div>
        ${t.done && t.doneAt ? `<div style="color:rgba(255,255,255,0.3);font-size:10px;margin-top:3px">${t.doneAt}</div>` : ""}
      </div>
      ${adminMode ? `<div style="display:flex;flex-direction:column;gap:4px">
        <button onclick="editTask(${t.id})" style="background:rgba(245,200,66,0.2);color:#f5c842;border:none;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:12px">✏️</button>
        <button onclick="deleteTask(${t.id})" style="background:rgba(255,80,80,0.15);color:#ff6b6b;border:none;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:12px">🗑</button>
      </div>` : ""}
    `;
    list.appendChild(div);
  });

  if (adminMode) {
    const addDiv = document.createElement("div");
    addDiv.style = "background:rgba(245,200,66,0.08);border:1px dashed rgba(245,200,66,0.3);border-radius:12px;padding:12px;margin-bottom:10px";
    addDiv.innerHTML = `
      <div style="color:#f5c842;font-weight:700;font-size:13px;margin-bottom:8px">+ Новая задача</div>
      <textarea id="newTaskTxt" placeholder="Введите задачу..." style="width:100%;background:#000;color:#fff;border:1px solid rgba(245,200,66,0.3);border-radius:8px;padding:8px;font-size:13px;min-height:48px;outline:none;resize:vertical"></textarea>
      <button onclick="addTask()" style="margin-top:6px;background:#f5c842;color:#000;border:none;border-radius:8px;padding:9px;font-weight:800;cursor:pointer;font-size:13px;width:100%">+ Добавить</button>
    `;
    list.appendChild(addDiv);
  }
}

function toggle(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "";
  render();
  saveToSheets();
}

function saveToSheets() {
  const status = document.getElementById("saveStatus");
  status.textContent = "Сохранение...";
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ action: "save", tasks })
  }).then(() => {
    status.textContent = "✅ Сохранено в Google Таблицу";
    setTimeout(() => status.textContent = "", 3000);
  }).catch(() => {
    status.textContent = "⚠️ Ошибка сохранения";
  });
}

function toggleAdmin() {
  if (adminMode) { adminMode = false; render(); document.getElementById("adminBtn").className = "btn btn-admin"; return; }
  document.getElementById("pinModal").classList.remove("hidden");
  setTimeout(() => document.getElementById("pinInput").focus(), 100);
}
function checkPin() {
  if (document.getElementById("pinInput").value === PIN) {
    adminMode = true;
    document.getElementById("pinModal").classList.add("hidden");
    document.getElementById("pinInput").value = "";
    document.getElementById("adminBtn").className = "btn btn-admin active";
    document.getElementById("adminBtn").textContent = "✅ Выйти из админа";
    render();
  } else {
    document.getElementById("pinErr").classList.remove("hidden");
  }
}
function closePin() {
  document.getElementById("pinModal").classList.add("hidden");
  document.getElementById("pinInput").value = "";
  document.getElementById("pinErr").classList.add("hidden");
}
function showReset() { document.getElementById("resetModal").classList.remove("hidden"); }
function resetShift() {
  tasks.forEach(t => { t.done = false; t.doneAt = ""; });
  document.getElementById("resetModal").classList.add("hidden");
  render();
  saveToSheets();
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  render();
}
function editTask(id) {
  const t = tasks.find(x => x.id === id);
  const txt = prompt("Редактировать задачу:", t.text);
  if (txt && txt.trim()) { t.text = txt.trim(); render(); }
}
function addTask() {
  const val = document.getElementById("newTaskTxt").value.trim();
  if (!val) return;
  tasks.push({ id: Date.now(), text: val, done: false, doneAt: "" });
  render();
}

render();
</script>
</body>
</html>
